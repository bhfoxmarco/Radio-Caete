<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Modelos Web Rádio</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; background:#000; }

  #slider { display:flex; width:1000%; height:100dvh; transition:transform 0.45s cubic-bezier(.4,0,.2,1); }

  .slide { width:10%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:space-between; position:relative; overflow:hidden; }

  .slide-header { width:100%; display:flex; align-items:center; justify-content:space-between; padding:48px 20px 12px; position:relative; z-index:10; }
  .modelo-nome { font-size:0.7rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.7; color:#fff; }
  .contador { font-size:0.75rem; font-weight:700; color:#fff; background:rgba(0,0,0,0.35); padding:4px 12px; border-radius:20px; backdrop-filter:blur(8px); }

  .player-center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; position:relative; z-index:5; padding:0 28px; }

  .logo-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:4px; }
  .logo-circle { width:110px; height:110px; border-radius:50%; border:2.5px solid rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; }
  .sua-logo { font-size:0.58rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#fff; opacity:0.45; }

  .radio-nome { font-size:1.05rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#fff; text-align:center; }
  .radio-sub { font-size:0.7rem; color:rgba(255,255,255,.5); letter-spacing:1px; }
  .tocando { font-size:0.67rem; color:rgba(255,255,255,.55); background:rgba(0,0,0,.28); padding:6px 16px; border-radius:20px; letter-spacing:.3px; backdrop-filter:blur(6px); margin-top:2px; text-align:center; }
  .tocando span { color:#fff; opacity:.85; }

  .play-btn { width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin-top:6px; cursor:pointer; box-shadow:0 4px 24px rgba(0,0,0,.35); }

  .volume-row { display:flex; align-items:center; gap:10px; margin-top:4px; opacity:.55; }
  .volume-bar { width:110px; height:3px; background:rgba(255,255,255,.2); border-radius:4px; position:relative; }
  .volume-fill { position:absolute; left:0; top:0; width:65%; height:100%; border-radius:4px; }

  /* Setas */
  .nav-btn { position:fixed; top:50%; transform:translateY(-50%); z-index:200; background:rgba(0,0,0,.35); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.15); color:#fff; width:38px; height:62px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.2rem; transition:opacity .2s, background .2s; user-select:none; }
  .nav-btn:hover { background:rgba(0,0,0,.6); }
  .nav-btn.hidden { opacity:0; pointer-events:none; }
  #btnPrev { left:5px; } #btnNext { right:5px; }

  /* Rodapé */
  .slide-footer { width:100%; padding:12px 24px 30px; display:flex; flex-direction:column; align-items:center; gap:14px; position:relative; z-index:10; }
  .social-row { display:flex; gap:22px; align-items:center; }
  .social-btn { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; opacity:.75; transition:opacity .2s; }
  .social-btn:hover { opacity:1; }
  .social-icon { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .social-label { font-size:0.54rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.55); }
  .dots { display:flex; gap:5px; align-items:center; }
  .dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.28); transition:all .3s; }
  .dot.active { width:20px; border-radius:4px; background:#fff; }

  /* FUNDOS */
  .bg1{background:radial-gradient(ellipse at 20% 80%,#0d3b1e,transparent 60%),radial-gradient(ellipse at 80% 20%,#1a5c2a,transparent 55%),linear-gradient(160deg,#081c0e,#0f2e18 50%,#0a1f10)}
  .bg1 .logo-circle{border-color:#22c55e;background:rgba(34,197,94,.12)}.bg1 .play-btn{background:#22c55e;color:#000}.bg1 .volume-fill{background:#22c55e}.bg1 .s-ig,.bg1 .s-wpp,.bg1 .s-sh{background:rgba(34,197,94,.2)}

  .bg2{background:radial-gradient(ellipse at 50% 0%,#ff6b1a,transparent 55%),radial-gradient(ellipse at 80% 100%,#b91c1c,transparent 50%),linear-gradient(180deg,#1a0a00,#2d1200 60%,#1a0800)}
  .bg2 .logo-circle{border-color:#fb923c;background:rgba(251,146,60,.12)}.bg2 .play-btn{background:#fb923c;color:#000}.bg2 .volume-fill{background:#fb923c}.bg2 .s-ig,.bg2 .s-wpp,.bg2 .s-sh{background:rgba(251,146,60,.2)}

  .bg3{background:radial-gradient(ellipse at 30% 40%,#312e81,transparent 55%),radial-gradient(ellipse at 70% 60%,#1e1b4b,transparent 50%),linear-gradient(135deg,#06050f,#0f0e27)}
  .bg3 .logo-circle{border-color:#818cf8;background:rgba(129,140,248,.12)}.bg3 .play-btn{background:#818cf8;color:#000}.bg3 .volume-fill{background:#818cf8}.bg3 .s-ig,.bg3 .s-wpp,.bg3 .s-sh{background:rgba(129,140,248,.2)}

  .bg4{background:radial-gradient(ellipse at 25% 75%,#78350f,transparent 55%),radial-gradient(ellipse at 75% 25%,#92400e,transparent 50%),linear-gradient(145deg,#1c0f05,#2d1a07 50%,#1a0e04)}
  .bg4 .logo-circle{border-color:#fbbf24;background:rgba(251,191,36,.10)}.bg4 .play-btn{background:#fbbf24;color:#000}.bg4 .volume-fill{background:#fbbf24}.bg4 .s-ig,.bg4 .s-wpp,.bg4 .s-sh{background:rgba(251,191,36,.2)}

  .bg5{background:radial-gradient(ellipse at 40% 60%,#0c4a6e,transparent 55%),radial-gradient(ellipse at 70% 30%,#075985,transparent 50%),linear-gradient(160deg,#020c12,#041e2e 60%,#020c12)}
  .bg5 .logo-circle{border-color:#22d3ee;background:rgba(34,211,238,.10)}.bg5 .play-btn{background:#22d3ee;color:#000}.bg5 .volume-fill{background:#22d3ee}.bg5 .s-ig,.bg5 .s-wpp,.bg5 .s-sh{background:rgba(34,211,238,.2)}

  .bg6{background:radial-gradient(ellipse at 50% 0%,#7c3aed55,transparent 60%),radial-gradient(ellipse at 0% 100%,#db277755,transparent 55%),radial-gradient(ellipse at 100% 100%,#4f46e555,transparent 55%),linear-gradient(160deg,#0a0010,#110020 60%,#0a0010)}
  .bg6 .logo-circle{border-color:#a78bfa;background:rgba(167,139,250,.10);box-shadow:0 0 24px rgba(167,139,250,.3)}.bg6 .play-btn{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff}.bg6 .volume-fill{background:#a78bfa}.bg6 .s-ig,.bg6 .s-wpp,.bg6 .s-sh{background:rgba(167,139,250,.2)}.bg6 .radio-nome{text-shadow:0 0 14px rgba(167,139,250,.6)}

  .bg7{background:radial-gradient(ellipse at 50% 0%,#7f1d1d,transparent 60%),radial-gradient(ellipse at 20% 100%,#450a0a,transparent 55%),linear-gradient(160deg,#0d0000,#1a0000 60%,#0d0000)}
  .bg7 .logo-circle{border-color:#f87171;background:rgba(248,113,113,.10)}.bg7 .play-btn{background:#f87171;color:#000}.bg7 .volume-fill{background:#f87171}.bg7 .s-ig,.bg7 .s-wpp,.bg7 .s-sh{background:rgba(248,113,113,.2)}

  .bg8{background:radial-gradient(ellipse at 30% 30%,#831843,transparent 55%),radial-gradient(ellipse at 70% 70%,#500724,transparent 55%),radial-gradient(ellipse at 60% 10%,#4a044e,transparent 50%),linear-gradient(160deg,#0c0008,#1a000f 60%,#0c0008)}
  .bg8 .logo-circle{border-color:#f472b6;background:rgba(244,114,182,.10)}.bg8 .play-btn{background:#f472b6;color:#000}.bg8 .volume-fill{background:#f472b6}.bg8 .s-ig,.bg8 .s-wpp,.bg8 .s-sh{background:rgba(244,114,182,.2)}

  .bg9{background:radial-gradient(ellipse at 20% 20%,#374151,transparent 60%),radial-gradient(ellipse at 80% 80%,#1f2937,transparent 55%),linear-gradient(145deg,#030405,#0d1117 60%,#030405)}
  .bg9 .logo-circle{border-color:#9ca3af;background:rgba(156,163,175,.10)}.bg9 .play-btn{background:#9ca3af;color:#000}.bg9 .volume-fill{background:#9ca3af}.bg9 .s-ig,.bg9 .s-wpp,.bg9 .s-sh{background:rgba(156,163,175,.2)}

  .bg10{background:radial-gradient(ellipse at 40% 30%,#92400e,transparent 55%),radial-gradient(ellipse at 70% 80%,#78350f,transparent 55%),linear-gradient(145deg,#0a0500,#1a0c00 60%,#0a0500)}
  .bg10 .logo-circle{border-color:#fcd34d;background:rgba(252,211,77,.08);box-shadow:0 0 24px rgba(252,211,77,.2)}.bg10 .play-btn{background:linear-gradient(135deg,#f59e0b,#fcd34d);color:#000}.bg10 .volume-fill{background:#fcd34d}.bg10 .s-ig,.bg10 .s-wpp,.bg10 .s-sh{background:rgba(252,211,77,.2)}.bg10 .radio-nome{text-shadow:0 0 12px rgba(252,211,77,.4)}

  /* Efeitos */
  .stars-l{position:absolute;inset:0;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twk 2s infinite alternate}
  @keyframes twk{from{opacity:.15}to{opacity:.9}}
  .wave-wrap{position:absolute;bottom:0;width:100%;pointer-events:none;overflow:hidden}
  .wave{position:absolute;bottom:-10px;width:200%;height:70px;border-radius:50%;animation:wm 7s linear infinite}
  .wave:nth-child(1){background:rgba(34,211,238,.12)}.wave:nth-child(2){background:rgba(14,165,233,.08);animation-duration:11s;bottom:10px}
  @keyframes wm{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .nlines{position:absolute;inset:0;pointer-events:none}
  .nline{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#a78bfa,transparent);animation:np 3s ease-in-out infinite}
  .nline:nth-child(1){top:25%}.nline:nth-child(2){top:62%;animation-delay:1.5s;opacity:.4}
  @keyframes np{0%,100%{opacity:.15}50%{opacity:.8}}
  .diag{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 22px,rgba(255,255,255,.02) 22px,rgba(255,255,255,.02) 23px);pointer-events:none}
  .gglow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(252,211,77,.08),transparent 65%);animation:gp 4s ease-in-out infinite;pointer-events:none}
  @keyframes gp{0%,100%{opacity:.5}50%{opacity:1}}
  .gfloor{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:110%;opacity:.15;pointer-events:none}
</style>
</head>
<body>

<button class="nav-btn hidden" id="btnPrev">&#8249;</button>
<button class="nav-btn" id="btnNext">&#8250;</button>
<div id="slider"></div>

<script>
const TOTAL = 10;

function mic(c){return`<svg width="52" height="52" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="3" width="12" height="19" rx="6" stroke="${c}" stroke-width="2" fill="none"/><path d="M8 18c0 5.523 4.477 10 10 10s10-4.477 10-10" stroke="${c}" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="18" y1="28" x2="18" y2="33" stroke="${c}" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="33" x2="24" y2="33" stroke="${c}" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="11" x2="24" y2="11" stroke="${c}" stroke-width="1.2" stroke-linecap="round" opacity=".5"/><line x1="12" y1="15" x2="24" y2="15" stroke="${c}" stroke-width="1.2" stroke-linecap="round" opacity=".5"/></svg>`}

const svgIG=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="#fff" stroke="none"/></svg>`;
const svgWPP=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`;
const svgSH=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`;

const modelos=[
  {bg:'bg1',cor:'#22c55e',nome:'Verde Floresta',   musica:'Evidências – Chitãozinho & Xororó'},
  {bg:'bg2',cor:'#fb923c',nome:'Pôr do Sol',        musica:'Aquarela do Brasil – Gal Costa'},
  {bg:'bg3',cor:'#818cf8',nome:'Noite Estrelada',   musica:'La Vie en Rose – Louis Armstrong'},
  {bg:'bg4',cor:'#fbbf24',nome:'Terra / Barro',     musica:'Tocando em Frente – Almir Sater'},
  {bg:'bg5',cor:'#22d3ee',nome:'Água Turquesa',     musica:'Garota de Ipanema – Tom Jobim'},
  {bg:'bg6',cor:'#a78bfa',nome:'Neon Roxo',         musica:'Blinding Lights – The Weeknd'},
  {bg:'bg7',cor:'#f87171',nome:'Vermelho Rock',     musica:'Bohemian Rhapsody – Queen'},
  {bg:'bg8',cor:'#f472b6',nome:'Galáxia Rosa',      musica:'As It Was – Harry Styles'},
  {bg:'bg9',cor:'#9ca3af',nome:'Grafite Urbano',    musica:'Notícias – Milton Nascimento'},
  {bg:'bg10',cor:'#fcd34d',nome:'Dourado Luxo',     musica:'My Way – Frank Sinatra'},
];

function extras(i){
  if(i===2)return`<div class="stars-l" id="sl2"></div>`;
  if(i===4)return`<div class="wave-wrap"><div class="wave"></div><div class="wave"></div></div>`;
  if(i===5)return`<div class="nlines"><div class="nline"></div><div class="nline"></div></div><svg class="gfloor" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="30" x2="500" y2="30" stroke="#a78bfa" stroke-width=".8"/><line x1="0" y1="55" x2="500" y2="55" stroke="#a78bfa" stroke-width=".6"/><line x1="0" y1="75" x2="500" y2="75" stroke="#a78bfa" stroke-width=".5"/><line x1="0" y1="92" x2="500" y2="92" stroke="#a78bfa" stroke-width=".35"/><line x1="250" y1="0" x2="0" y2="120" stroke="#db2777" stroke-width=".6"/><line x1="250" y1="0" x2="500" y2="120" stroke="#db2777" stroke-width=".6"/><line x1="250" y1="0" x2="100" y2="120" stroke="#db2777" stroke-width=".4"/><line x1="250" y1="0" x2="175" y2="120" stroke="#db2777" stroke-width=".4"/><line x1="250" y1="0" x2="325" y2="120" stroke="#db2777" stroke-width=".4"/><line x1="250" y1="0" x2="400" y2="120" stroke="#db2777" stroke-width=".4"/></svg>`;
  if(i===7)return`<div class="stars-l" id="sl7"></div>`;
  if(i===8)return`<div class="diag"></div>`;
  if(i===9)return`<div class="gglow"></div>`;
  return'';
}

function dots(ativo){return modelos.map((_,i)=>`<div class="dot${i===ativo?' active':''}"></div>`).join('')}

const slider=document.getElementById('slider');
modelos.forEach((m,i)=>{
  const s=document.createElement('div');
  s.className=`slide ${m.bg}`;
  s.innerHTML=`
    ${extras(i)}
    <div class="slide-header">
      <span class="modelo-nome">${m.nome}</span>
      <span class="contador">${i+1}/${TOTAL}</span>
    </div>
    <div class="player-center">
      <div class="logo-wrap">
        <div class="logo-circle">${mic(m.cor)}</div>
        <span class="sua-logo">SUA LOGO</span>
      </div>
      <div class="radio-nome">Nome Sua Web Rádio</div>
      <div class="radio-sub">🔴 Ao vivo • 24 horas</div>
      <div class="tocando">🎵 Tocando agora: <span>${m.musica}</span></div>
      <div class="play-btn">▶</div>
      <div class="volume-row">
        <span style="font-size:.9rem;color:#fff">🔈</span>
        <div class="volume-bar"><div class="volume-fill"></div></div>
        <span style="font-size:.9rem;color:#fff">🔊</span>
      </div>
    </div>
    <div class="slide-footer">
      <div class="social-row">
        <div class="social-btn"><div class="social-icon s-ig">${svgIG}</div><span class="social-label">Instagram</span></div>
        <div class="social-btn"><div class="social-icon s-wpp">${svgWPP}</div><span class="social-label">WhatsApp</span></div>
        <div class="social-btn"><div class="social-icon s-sh">${svgSH}</div><span class="social-label">Compartilhar</span></div>
      </div>
      <div class="dots" id="d${i}">${dots(i)}</div>
    </div>`;
  slider.appendChild(s);
});

let cur=0;
const bp=document.getElementById('btnPrev');
const bn=document.getElementById('btnNext');

function goTo(n){
  cur=Math.max(0,Math.min(TOTAL-1,n));
  slider.style.transform=`translateX(-${cur*10}%)`;
  bp.classList.toggle('hidden',cur===0);
  bn.classList.toggle('hidden',cur===TOTAL-1);
  document.querySelectorAll('.dots').forEach(d=>{d.innerHTML=dots(cur)});
}

bp.addEventListener('click',()=>goTo(cur-1));
bn.addEventListener('click',()=>goTo(cur+1));

let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const dx=tx-e.changedTouches[0].clientX;if(Math.abs(dx)>40)goTo(cur+(dx>0?1:-1))},{passive:true});

function estrelas(id,q){
  const el=document.getElementById(id);if(!el)return;
  for(let i=0;i<q;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+.5;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*2}s;animation-duration:${1.5+Math.random()*2}s`;el.appendChild(s);}
}
estrelas('sl2',40); estrelas('sl7',30);
goTo(0);
</script>
</body>
</html>
